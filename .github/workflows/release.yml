name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: viyal
            asset_name: viyal-${{ github.ref_name }}-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: viyal.exe
            asset_name: viyal-${{ github.ref_name }}-windows.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: viyal
            asset_name: viyal-${{ github.ref_name }}-macos-intel.tar.gz
          - os: macos-14 # M1/Silicon runner
            target: aarch64-apple-darwin
            artifact_name: viyal
            asset_name: viyal-${{ github.ref_name }}-macos-silicon.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --bin viyal --target ${{ matrix.target }}

      - name: Prepare packaging directory
        shell: bash
        run: |
          mkdir release_pkg
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release_pkg/
          cp -r stdlib release_pkg/
          cp README.md release_pkg/ 2>/dev/null || :

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd release_pkg
          tar -czf ../${{ matrix.asset_name }} *

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path release_pkg\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
