[package]
name = "viyal"
version = "0.1.1"
edition = "2024"

[dependencies]
ast = { path = "../../compiler/ast" }
parser = { path = "../../compiler/parser" }
bytecode = { path = "../../compiler/bytecode" }
vm = { path = "../../vm" }
stdlib = { path = "../../stdlib" }
formatter = { path = "../formatter" }
analyzer = { path = "../analyzer" }
lsp = { path = "../lsp" }
codegen = { path = "../../compiler/codegen" }
pub_tool = { path = "../pub" }
debugger = { path = "../debugger" }
typechecker = { path = "../../compiler/typechecker" }
notify = "8.2.0"
miette = { version = "7.6.0", features = ["fancy"] }
mir = { version = "0.1.1", path = "../../compiler/mir" }
optimizer = { version = "0.1.1", path = "../../compiler/optimizer" }
resolver = { version = "0.1.1", path = "../../compiler/resolver" }
backend = { path = "../../compiler/backend" }
